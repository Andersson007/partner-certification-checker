breaking_changes:
  - >-
    Bumped ansible-lint from 24.12.2 to 26.4.0. This major version upgrade
    may flag new lint violations in partner collections that previously passed.
  - >-
    Bumped galaxy-importer from 0.4.31 to 0.4.39.
  - >-
    The default ``ansible-core-version`` input changed from 2.16.0 to 2.16.19
    to satisfy the ansible-lint 26.4.0 dependency requirement
    (``ansible-core>=2.16.14``).
